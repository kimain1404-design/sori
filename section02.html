<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>VOICE PT | 음률 보이스 PT 소개</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="css/section02.css?v=5" />
    <script>
      document.documentElement.classList.add("js");
    </script>
    <script src="js/section02.js?v=5" defer></script>
  </head>
  <body>
    <section class="s2" id="section02" aria-labelledby="s2-title">
      <div class="s2__bg" aria-hidden="true">
        <img class="s2__bg-photo" src="img/section02/hero-mic.jpg" alt="" width="2017" height="449" />
        <div class="s2__arc"></div>
      </div>

      <div class="wrap">
        <div class="hero">
          <p class="bubble bubble--1">
            <span class="bubble__in">목소리가 작아서 발표나 면접이 두려우신가요?</span>
          </p>
          <p class="bubble bubble--2">
            <span class="bubble__in">웅얼거리는 발음 때문에 자꾸 되물어보나요?</span>
          </p>
          <p class="bubble bubble--3">
            <span class="bubble__in">학원 갈 시간이 없어서 목소리 교정을 미루고 계신가요?</span>
          </p>

          <div class="card">
            <img class="card__photo" src="img/section02/hero-mic.jpg" alt="" width="2017" height="449" />
            <div class="card__shade"></div>
            <h2 class="hero__title" id="s2-title">
              <span class="line"><span>하고 싶은 말은 있는데</span></span>
              <span class="line"><span>생각만큼 전해지지 않나요?</span></span>
            </h2>
          </div>
        </div>

        <div class="connector" aria-hidden="true">
          <span class="connector__bar"></span><span class="connector__dot"></span>
        </div>

        <div class="lead" data-r>
          <p class="lead__q rv">내 목소리가 답답했던 순간들</p>
          <p class="lead__a rv" style="--d: 0.15s">
            <span class="chunk">이제는</span
            ><span class="hl"
              ><span class="hl__bg"></span><span class="hl__txt">음률 보이스 PT</span></span
            ><span class="chunk">로</span> <br class="mo" /><span class="chunk"
              >달라질 차례입니다.</span
            >
          </p>
        </div>

        <div class="voice" data-r aria-hidden="true">
          <div class="voice__glow"></div>
          <div class="voice__row">
            <div class="wave" data-side="l"></div>
            <div class="mic">
              <picture
                ><source srcset="img/section02/mic.webp" type="image/webp" />
                <img src="img/section02/mic.png" alt="" width="820" height="1007"
              /></picture>
            </div>
            <div class="wave" data-side="r"></div>
          </div>
        </div>

        <div class="divider" data-r aria-hidden="true">
          <svg viewBox="0 0 1325 36" preserveAspectRatio="none">
            <path d="M618 1 L0 1" />
            <path d="M707 1 L1325 1" />
            <path d="M618 1 L662.5 35 L707 1" />
          </svg>
        </div>

        <div class="learn" data-r>
          <h3 class="learn__title rv">
            <span class="learn__brand">음률 보이스 PT</span>
            <span class="learn__rest"
              >[<span class="talk" aria-hidden="true"
                ><svg viewBox="0 0 86 58">
                  <g fill="#5b92f6">
                    <ellipse cx="22" cy="34" rx="18" ry="16" />
                    <ellipse cx="38" cy="22" rx="20" ry="18" />
                    <ellipse cx="58" cy="21" rx="20" ry="17" />
                    <ellipse cx="70" cy="33" rx="14" ry="14" />
                    <ellipse cx="46" cy="40" rx="26" ry="14" />
                    <path d="M58 44 L80 57 L70 38 Z" />
                  </g>
                  <circle class="d" cx="34" cy="32" r="3.2" fill="#fff" />
                  <circle class="d" cx="45" cy="32" r="3.2" fill="#fff" />
                  <circle class="d" cx="56" cy="32" r="3.2" fill="#fff" /></svg></span
              >]이런 걸 배울거예요</span
            >
          </h3>
          <p class="learn__sub rv" style="--d: 0.15s">
            말하는 요령을 넘어 <br class="mo" />목소리를 쓰는 기본부터 대화 스킬까지
          </p>
        </div>

        <div class="cards" data-r>
          <div class="tile" tabindex="0" style="--k: 0" role="img" aria-label="발성 VOICE">
            <img
              class="tile__img"
              src="img/section02/card-voice.jpg"
              alt=""
              loading="lazy"
              width="639"
              height="1010"
            /><span class="tile__veil"></span>
          </div>
          <div class="tile" tabindex="0" style="--k: 1" role="img" aria-label="몸짓 GESTURE">
            <img
              class="tile__img"
              src="img/section02/card-gesture.jpg"
              alt=""
              loading="lazy"
              width="639"
              height="1010"
            /><span class="tile__veil"></span>
          </div>
          <div class="tile" tabindex="0" style="--k: 2" role="img" aria-label="전문적인 TECHNICAL">
            <img
              class="tile__img"
              src="img/section02/card-technical.jpg"
              alt=""
              loading="lazy"
              width="639"
              height="1010"
            /><span class="tile__veil"></span>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
