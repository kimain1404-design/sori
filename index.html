<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VOICE PT | 보이스로 인생이 달라진다</title>
  <link rel="preload" href="fonts/Paperlogy-4Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/Paperlogy-6SemiBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/hero.css">
  <style>html,body{margin:0;padding:0;background:#0a1a33;}</style>
</head>
<body>

<div class="vp-hero">
  <img class="vp-hero__bg vp-hero__bg--pc" src="img/hero_pc.webp" alt="음률 이주성 대표" width="3200" height="1092">
  <img class="vp-hero__bg vp-hero__bg--mob" src="img/hero_mob.webp" alt="음률 이주성 대표" width="2160" height="2160">
  <div class="vp-hero__content">
    <div class="vp-hero__title">
      <div class="vp-hero__line vp-hero__line--1">보이스로</div>
      <div class="vp-hero__line vp-hero__line--2">
        <span class="vp-swap">
          <span class="vp-swap__bracket vp-swap__bracket--l">[</span>
          <span class="vp-swap__slot"><span class="vp-swap__track">
            <span class="vp-swap__item vp-swap__wave"><span class="vp-swap__bar">|</span><span class="vp-swap__bar">|</span><span class="vp-swap__bar">|</span><span class="vp-swap__bar">|</span><span class="vp-swap__bar">|</span><span class="vp-swap__bar">|</span><span class="vp-swap__bar">|</span></span>
            <span class="vp-swap__item vp-swap__word vp-swap__word--1">인생</span>
            <span class="vp-swap__item vp-swap__word vp-swap__word--2">직업</span>
            <span class="vp-swap__item vp-swap__word vp-swap__word--3">대학</span>
          </span></span>
          <span class="vp-swap__bracket vp-swap__bracket--r">]</span>
        </span><span class="vp-hero__tail">이 달라진다</span>
      </div>
    </div>
    <div class="vp-hero__desc">회의부터 발표, 일상 속 대화까지<br>목소리 하나로 달라지는 말하기의 순간을 경험해보세요</div>
    <a class="vp-hero__cta" href="#">보이스 PT 시작하기 <span class="vp-hero__arrow">↗</span></a>
  </div>
</div>

</body>
</html>
