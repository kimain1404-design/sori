<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VOICE PT | 보이스로 인생이 달라진다</title>
  <!-- 첫 화면 제목 폰트 미리 불러오기 -->
  <link rel="preload" href="fonts/Paperlogy-4Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/Paperlogy-6SemiBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/hero.css">
</head>
<body>

  <section class="vp-hero" aria-labelledby="vp-hero-title">
    <!-- 배경: 화면 폭 767px 이하는 모바일 이미지, 그 이상은 PC 이미지 -->
    <picture class="vp-hero__bg">
      <source media="(max-width: 767px)" srcset="img/hero_mob.webp">
      <img src="img/hero_pc.webp" alt="음률 이주성 대표" width="3200" height="1092" fetchpriority="high">
    </picture>

    <div class="vp-hero__content">
      <h1 class="vp-hero__title" id="vp-hero-title">
        <span class="vp-hero__line vp-hero__line--1">보이스로</span>
        <span class="vp-hero__line vp-hero__line--2">
          <!-- [ ] 안 단어 회전: data-words 에 쉼표로 단어를 넣으면 됩니다 -->
          <span class="vp-swap" data-words="인생,직업,대학" aria-hidden="true">
            <span class="vp-swap__bracket">[</span>
            <span class="vp-swap__slot">
              <span class="vp-swap__track">
                <span class="vp-swap__item vp-swap__wave is-active">
                  <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
                </span>
              </span>
            </span>
            <span class="vp-swap__bracket">]</span>
          </span><span class="vp-hero__tail">이 달라진다</span>
        </span>
        <!-- 스크린리더용 문장 -->
        <span class="vp-sr-only">보이스로 인생, 직업, 대학이 달라진다</span>
      </h1>

      <p class="vp-hero__desc">
        회의부터 발표, 일상 속 대화까지<br>
        목소리 하나로 달라지는 말하기의 순간을 경험해보세요
      </p>

      <a class="vp-hero__cta" href="#">
        보이스 PT 시작하기
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8.5 7H17v8.5"/></svg>
      </a>
    </div>
  </section>

  <script src="js/hero.js"></script>
</body>
</html>
